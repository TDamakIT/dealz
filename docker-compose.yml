# Dealz — environnement local de test (VM Ubuntu)
# Lancement : docker compose up -d   puis   ./scripts/setup_wordpress.sh
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache   # dernière version de WordPress (WooCommerce récent exige WordPress 7+)
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DEALZ_AGENTS_URL', 'http://agents:8000');
        define('DEALZ_AGENTS_TOKEN', '${AGENTS_API_TOKEN}');
    volumes:
      - wp_data:/var/www/html
      - ./wp-plugin/dealz-liste:/var/www/html/wp-content/plugins/dealz-liste

  # Outil en ligne de commande WordPress (utilisé par scripts/setup_wordpress.sh)
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./wp-plugin/dealz-liste:/var/www/html/wp-content/plugins/dealz-liste
      - ./data:/data:ro

  agents:
    build: ./agents
    restart: unless-stopped
    depends_on:
      - wordpress
    env_file: .env
    environment:
      WOO_URL: http://wordpress
      DATA_DIR: /app/var
      CATALOG_PATH: /app/data/catalog.json
    ports:
      - "${AGENTS_PORT:-8000}:8000"
    volumes:
      - agents_data:/app/var
      - ./data:/app/data:ro

volumes:
  db_data:
  wp_data:
  agents_data:
